<!DOCTYPE html>
<html lang="en">
    <head>
    <title> Working of div and span</title>
        <style>
            .div1{
                background-color: rgb(142,142,245);
            }
            .div2{
                background-color: purple;
            }
            .div3{
                background-color: #9af19a;
            }
            .container{
                display: flex;
                flex-direction: column;
                width: 150px;
            }
            .sidebar{
                background-color: orange;
            }
        </style>
    </head>
    <body>
        <div class="div1">Example 1 - <span style="background-color: yellow;">Div 1 coloured with rgb</span></div>
        <div class="div2">Example 2 - Div 2 coloured with <span style="background-color: yellow;">Keyword  purple</span></div>
        <div class="div3">Example 3 - Div 3 coloured with hex</div>
    </body>
</html>
