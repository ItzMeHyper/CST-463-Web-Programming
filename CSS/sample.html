<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Styled Table in a Div</title>
   <style>
      table {
        
      }
   </style>
</head>
<body>
   <div class="table-wrapper">
      <h2>Student Results</h2>
      <table>
         <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Year</th>
            <th>Grade</th>
         </tr>
         <tr>
            <td>Alice</td>
            <td>Web Programming</td>
            <td>4th Year</td>
            <td>A</td>
         </tr>
         <tr>
            <td>Brian</td>
            <td>Database Systems</td>
            <td>4th Year</td>
            <td>B+</td>
         </tr>
         <tr>
            <td>Claire</td>
            <td>Software Engineering</td>
            <td>4th Year</td>
            <td>A-</td>
         </tr>
      </table>
   </div>
</body>
</html>
