<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Styled Table in a Div</title>
   <style>
      table {
         border-collapse: separate;
         border-spacing: 20px;
         margin: 40px;
      }
      td{
         padding: 20px;
         border: 5px solid #4CAF50;
         margin: 10px;
         background-color: #f2f2f2;
      }
      .table-wrapper {
         border: 5px dashed #4CAF50;
         padding: 30px;
         margin: 20px;
         background-color: #e6ffe6;
      }
   </style>
</head>
<body>
   <div class="table-wrapper">
      <h2>Student Results</h2>
      <table>
         <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Year</th>
            <th>Grade</th>
         </tr>
         <tr>
            <td>Alice</td>
            <td>Web Programming</td>
            <td>4th Year</td>
            <td>A</td>
         </tr>
         <tr>
            <td>Brian</td>
            <td>Database Systems</td>
            <td>4th Year</td>
            <td>B+</td>
         </tr>
         <tr>
            <td>Claire</td>
            <td>Software Engineering</td>
            <td>4th Year</td>
            <td>A-</td>
         </tr>
      </table>
   </div>
</body>
</html>
