<!DOCTYPE html>
<html>
    <head>
        <title>Odd and Even Numbers</title>
    </head>

<body>
    <h2>Check Whether a Number is Odd or Even</h2>
    <label>Enter a number:</label>
    <input type="number" id="num"> <br><br>
<br>
<button onclick="checkNumber()">Check</button>

<h3 id="result"></h3>

<script>
function checkNumber() {
    let n = parseInt(document.getElementById("num").value);

    if (n % 2 == 0)
        document.getElementById("result").innerHTML = "The given Number " + n + " is Even";
    else
        document.getElementById("result").innerHTML = "The given Number " + n + " is Odd";
}
</script>

</body>
</html>
