<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Two Numbers</title>
</head>
<body>
    <h2>Add Two Numbers</h2>
    <script>
        var num1 = 5;
        var num2 = 10;
        var sum = num1 + num2;
        
        document.write("First Number: " + num1 + "<br>");
        document.write("Second Number: " + num2 + "<br>");
        document.write("Sum: " + sum);
    </script>
</body>
</html>
