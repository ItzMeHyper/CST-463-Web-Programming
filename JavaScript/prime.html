<!DOCTYPE html>
<html>
<head>
    <title>Given Number Is Prime Or Not</title>
</head>
<body>

    <h2>Check Whether a Number is Prime or Not</h2>

    <label>Enter a number:</label>
    <input type="number" id="num">
    <br><br>

    <button onclick="isPrime()">Check</button>

    <h2 id="result"></h2>

    <script>
        function isPrime() {
            let num = document.getElementById("num").value;
            let prime = true;

            if (num <= 1) {
                prime = false;
            }

            for (let i = 2; i < num; i++) {
                if (num % i == 0) {
                    prime = false;
                    break;
                }
            }

            if (prime)
                document.getElementById("result").innerHTML = num + " is Prime";
            else
                document.getElementById("result").innerHTML = num + " is Not Prime";
        }
    </script>

</body>
</html>
